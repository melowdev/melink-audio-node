name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/audio/resolver.js
      - run: node --check src/core/player.js
      - run: node --check src/lavalink/compat.js
      - run: npm audit --omit=dev
      - if: matrix.os == 'ubuntu-latest'
        run: node bench/api.js --iterations=100 --concurrency=10
